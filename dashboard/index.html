<!doctype html>
<html lang="en">
  <head>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noor</title>
  </head>
  <body>
    <div class="mainDiv">
      <div class="dashHeader">
        <button class="backBtn" aria-label="Go back">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
      </div>
      <div class="content">
        <div class="imgContainer">
          <img src="" alt="" />
        </div>

        <div class="playingRange">
          <div class="playerName">
            <div class="playerTitle">
              <h4>Forever Outside</h4>
              <p>Evergrey</p>
            </div>
            <div class="icon">
              <i class="fa-solid fa-bars icons"></i>
            </div>
          </div>
          <div class="progressSection">
            <input type="range" min="0" max="100" value="30" />
            <div class="time"><span>0:20</span> <span>-0:46</span></div>
          </div>
        </div>

        <div class="control">
          <button><i class="fa-solid fa-backward backward"></i></button>
          <button class="play-btn">
            <i id="icons" class="fa-solid fa-play pause"></i>
          </button>
          <!-- <button class="play-btn"><i class="fa-solid fa-play"></i></button> -->
          <button><i class="fa-solid fa-forward forward"></i></button>
        </div>

        <div class="volume">
          <button><i class="fa-solid fa-volume"></i></button>
          <input type="range" min="0" max="100" value="80" />
          <button><i class="fa-solid fa-volume"></i></button>
        </div>

        <div class="playlist">
          <div class="playlist-item" data-index="0"></div>
        </div>
      </div>
      <div class="audioStatus">
        <span class="loader"></span>
        <span class="message"> Loading audio... </span>
      </div>
    </div>

    <script src="./js/script.js"></script>
  </body>
</html>
